name: Windows integration

# End-to-end agent test on a real Windows host: installs Sysmon, provides an
# osquery binary, starts a manager and drives the agent through ETW, Sysmon,
# hooks and command execution (agent/agent_test.go: TestAgent, and
# sysmon/sysmon_windows_test.go: TestSysmonInfo).
#
# Sysmon and osquery are not redistributable from this repository, so they are
# downloaded at run time. This job changes system state (Sysmon driver, ETW
# autologger, audit policy), which is fine on ephemeral hosted runners but is
# why it is not part of every push.

on:
  workflow_dispatch:
  schedule:
    - cron: "41 7 * * 3" # weekly, Wednesday 07:41 UTC
  pull_request:
    paths:
      - "agent/**"
      - "sysmon/**"
      - "utilities/whids/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/integration-windows.yml"

permissions:
  contents: read

concurrency:
  group: integration-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    name: Agent integration (windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Fetch Sysmon
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          trap { Write-Output "::error title=Fetch Sysmon::$($_.Exception.Message)"; exit 1 }
          New-Item -ItemType Directory -Force sysmon\data | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'Sysmon.zip'
          Invoke-WebRequest -Uri 'https://download.sysinternals.com/files/Sysmon.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'sysmon') -Force
          Copy-Item (Join-Path $env:RUNNER_TEMP 'sysmon\Sysmon64.exe') sysmon\data\Sysmon64.exe
          # Authenticode check: refuse to install an unsigned/tampered driver package
          $sig = Get-AuthenticodeSignature sysmon\data\Sysmon64.exe
          if ($sig.Status -ne 'Valid') { throw "Sysmon64.exe signature is $($sig.Status)" }
          Write-Host "Sysmon signer: $($sig.SignerCertificate.Subject)"

      - name: Fetch osquery
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          trap { Write-Output "::error title=Fetch osquery::$($_.Exception.Message)"; exit 1 }
          New-Item -ItemType Directory -Force agent\data | Out-Null
          choco install osquery --no-progress -y
          $bin = Get-ChildItem -Path "$env:ProgramFiles\osquery" -Recurse -Filter osqueryi.exe | Select-Object -First 1
          if (-not $bin) { throw 'osqueryi.exe not found after install' }
          Copy-Item $bin.FullName agent\data\windows.osqueryi.exe
          & agent\data\windows.osqueryi.exe --version

      - name: Sysmon install test
        shell: pwsh
        run: |
          go test -json -count=1 -timeout 15m -run 'TestSysmonInfo$' ./sysmon > go-test-sysmon.json
          $status = $LASTEXITCODE
          python .github/scripts/go-test-report.py go-test-sysmon.json "Sysmon install test"
          if ($LASTEXITCODE -ne 0) { $status = 1 }
          exit $status

      - name: Agent integration test
        shell: pwsh
        run: |
          go test -json -count=1 -timeout 40m -run 'TestAgent$|TestReporting$' ./agent ./agent/config > go-test-agent.json
          $status = $LASTEXITCODE
          python .github/scripts/go-test-report.py go-test-agent.json "Agent integration test"
          if ($LASTEXITCODE -ne 0) { $status = 1 }
          exit $status

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: integration-test-results
          path: go-test-*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Collect logs on failure
        if: failure()
        shell: pwsh
        run: |
          Get-WinEvent -LogName 'Microsoft-Windows-Sysmon/Operational' -MaxEvents 50 -ErrorAction SilentlyContinue |
            Format-List TimeCreated, Id, Message
